# ACT-GUI workbench. Relative paths in this file resolve from deploy/; the build context is the repository root.
# Start (from the repository root):     docker compose -f deploy/compose.yaml up -d   -> http://127.0.0.1:8080
# With NVIDIA GPUs:                     add -f deploy/compose.gpu.yaml
# With ACT's data/ and literature/:     add -f deploy/compose.actdata.yaml (model sources for the Load model panel)
# With a mounted Gurobi license file:   add -f deploy/compose.gurobi.yaml (or upload it in the Engine tab)
# Optional settings:                    copy deploy/.env.example to deploy/.env
# Build from source first:              scripts/docker_build.sh
name: act-gui

services:
  workbench:
    image: ${ACT_GUI_IMAGE:-act-gui:0.1.0}
    build:
      context: ..  # the repository root
      dockerfile: deploy/Dockerfile
      additional_contexts:
        act: ../build/act
      args:
        GUROBIPY_VERSION: ${GUROBIPY_VERSION:-13.0.0}
    ports:
      - "127.0.0.1:${ACT_GUI_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - act-gui-data:/data
    restart: unless-stopped

volumes:
  act-gui-data:
